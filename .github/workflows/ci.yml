name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run check:astro
      - run: npm run format:check
      - run: npx knip
      - name: Block eslint-disable comments
        run: |
          if git grep -n "eslint-disable" -- "*.ts" "*.tsx" "*.js" "*.jsx" "*.astro"; then
            echo "eslint-disable comments are not allowed."
            exit 1
          fi
      - run: npm run test:ci
      - run: npm run build
      - run: npm run size
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # Production dependencies must be clean — this fails the build.
      - run: npm audit --omit=dev --audit-level=low
      # Dev-only advisories (extract-zip via @lhci/cli, no fixed version) are
      # advisory: they never reach the published package.
      - run: npm audit --audit-level=moderate
        continue-on-error: true
